name: Validate flight lab
on:
  push:
    branches: [main, codex/tomcat-flight-simulator]
  pull_request:
permissions:
  contents: read
jobs:
  physics-and-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: python -m unittest discover -s simulator/tests -p 'test_*.py'
      - run: python -m pip install Pillow==13.0.0
      - run: python PROJECT_TOMCAT/src/check_delivery.py
      - run: npm run build
      - run: git diff --exit-code -- simulator/dist simulator/assets/THREE-LICENSE.txt
